name: sitekeeper
options:
  bundleIdPrefix: com.chengjinfang
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: "3H8UVVUCP3"
targets:
  sitekeeper-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    preBuildScripts:
      - name: File Deletion Policy Guard
        script: |
          "${SRCROOT}/scripts/release/check_file_deletion_policy.sh"
          "${SRCROOT}/scripts/release/check_datastore_write_policy.sh"
        inputFiles:
          - "$(SRCROOT)/scripts/release/check_file_deletion_policy.sh"
          - "$(SRCROOT)/scripts/release/check_datastore_write_policy.sh"
          - "$(SRCROOT)/Sources"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: sitekeeperWidgetExtension
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: 工地掌柜
        PRODUCT_MODULE_NAME: sitekeeper
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/sitekeeper.entitlements
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 工地掌柜
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描项目发票、收据、施工资料和随手记拍照。
        INFOPLIST_KEY_NSContactsUsageDescription: 用于从系统通讯录导入项目联系人，并支持电话短信联络。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于在水印照片中带入拍摄位置。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于在随手记中录制现场语音。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于从相册选择项目照片、票据、施工资料和随手记素材。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于将水印现场照片保存到系统相册。
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.chengjinfang.sitekeeper
            CFBundleURLSchemes:
              - sitekeeper
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  sitekeeperWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared/Services/WidgetSharedModels.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: SitekeeperWidget
        PRODUCT_MODULE_NAME: sitekeeperWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper.widget
        CODE_SIGN_ENTITLEMENTS: Widget/WidgetExtension.entitlements
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Sitekeeper Widget
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: widgetBackground
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.chengjinfang.sitekeeper

  sitekeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: sitekeeper-iOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/工地掌柜.app/工地掌柜"
        BUNDLE_LOADER: "$(TEST_HOST)"

  sitekeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: sitekeeper-iOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: sitekeeper-iOS
schemes:
  sitekeeper-iOS:
    shared: true
    build:
      targets:
        sitekeeper-iOS: all
        sitekeeperWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - sitekeeperTests

  sitekeeper-iOS-UITests:
    shared: true
    build:
      targets:
        sitekeeper-iOS: all
        sitekeeperWidgetExtension: all
    test:
      config: Debug
      targets:
        - sitekeeperUITests
