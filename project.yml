name: sitekeeper
options:
  bundleIdPrefix: com.chengjinfang
  xcodeVersion: "27.1"
  groupOrdering:
    - pattern: "^Features$"
      order: [计算, 清单, 首页, 随手记, 我的, 项目]
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: complete
  DEVELOPMENT_TEAM: "3H8UVVUCP3"
targets:
  sitekeeper-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    preBuildScripts:
      - name: Release Boundary Guards
        script: |
          set -eu
          if [ "${CONFIGURATION:-Debug}" = "Debug" ] && [ "${SITEKEEPER_RUN_BUILD_GUARDS:-0}" != "1" ]; then
            echo "Release boundary guards run in preflight/CI; skipped for incremental Debug build."
            exit 0
          fi
          "${SRCROOT}/scripts/release/check_file_deletion_policy.sh"
          "${SRCROOT}/scripts/release/check_datastore_write_policy.sh"
          "${SRCROOT}/scripts/release/check_backup_contract_boundary.sh"
          "${SRCROOT}/scripts/release/check_drawing_release_boundary.sh"
          "${SRCROOT}/scripts/release/check_dynamic_type_policy.sh"
          "${SRCROOT}/scripts/release/check_userdefaults_policy.sh"
          "${SRCROOT}/scripts/release/check_swiftui_identity_policy.sh"
          "${SRCROOT}/scripts/release/check_unchecked_sendable_policy.sh"
        inputFiles:
          - "$(SRCROOT)/scripts/release/check_file_deletion_policy.sh"
          - "$(SRCROOT)/scripts/release/check_datastore_write_policy.sh"
          - "$(SRCROOT)/scripts/release/check_backup_contract_boundary.sh"
          - "$(SRCROOT)/scripts/release/check_drawing_release_boundary.sh"
          - "$(SRCROOT)/scripts/release/check_dynamic_type_policy.sh"
          - "$(SRCROOT)/scripts/release/check_userdefaults_policy.sh"
          - "$(SRCROOT)/scripts/release/check_swiftui_identity_policy.sh"
          - "$(SRCROOT)/scripts/release/check_unchecked_sendable_policy.sh"
          - "$(SRCROOT)/project.yml"
          - "$(SRCROOT)/sitekeeper.xcodeproj/project.pbxproj"
          - "$(SRCROOT)/Sources"
          - "$(SRCROOT)/Widget"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: sitekeeperWidgetExtension
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: 工地掌柜
        PRODUCT_MODULE_NAME: sitekeeper
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/sitekeeper.entitlements
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Resources/SitekeeperInfo.plist
  sitekeeperWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared/Services/WidgetSharedModels.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: SitekeeperWidget
        PRODUCT_MODULE_NAME: sitekeeperWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper.widget
        CODE_SIGN_ENTITLEMENTS: Widget/WidgetExtension.entitlements
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 工地掌柜小组件
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: widgetBackground
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.chengjinfang.sitekeeper

  sitekeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: sitekeeper-iOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/工地掌柜.app/工地掌柜"
        BUNDLE_LOADER: "$(TEST_HOST)"

  sitekeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: sitekeeper-iOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjinfang.sitekeeper.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: sitekeeper-iOS
schemes:
  sitekeeper-iOS:
    shared: true
    build:
      targets:
        sitekeeper-iOS: all
        sitekeeperWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - sitekeeperTests

  sitekeeper-iOS-UITests:
    shared: true
    build:
      targets:
        sitekeeper-iOS: all
        sitekeeperWidgetExtension: all
    test:
      config: Debug
      targets:
        - sitekeeperUITests
