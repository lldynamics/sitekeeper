included:
  - Sources
  - Tests
  - UITests
  - Widget

excluded:
  - .git
  - .build
  - build
  - DerivedData
  - .DerivedData*
  - sitekeeper.xcodeproj
  - AppStoreShots
  - docs

reporter: xcode
baseline: .swiftlint-baseline.json

# Keep lint scope focused on style consistency plus a small first batch of
# structural quality rules. Existing debt is held in `.swiftlint-baseline.json`
# so new regressions stay visible without blocking ongoing refactors.
only_rules:
  - closure_spacing
  - colon
  - comma
  - control_statement
  - cyclomatic_complexity
  - empty_parentheses_with_trailing_closure
  - file_length
  - force_cast
  - force_try
  - function_body_length
  - opening_brace
  - return_arrow_whitespace
  - statement_position
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length
  - vertical_whitespace

cyclomatic_complexity:
  warning: 10
  error: 20

file_length:
  warning: 400
  error: 800
  ignore_comment_only_lines: true

force_cast:
  severity: error

force_try:
  severity: error

function_body_length:
  warning: 50
  error: 150

type_body_length:
  warning: 250
  error: 450
