name: Unchecked Sendable Policy

on:
  pull_request:
    paths:
      - "Sources/**/*.swift"
      - "Widget/**/*.swift"
      - "scripts/release/check_unchecked_sendable_policy.sh"
      - ".github/workflows/unchecked-sendable-policy.yml"
  push:
    branches:
      - main
    paths:
      - "Sources/**/*.swift"
      - "Widget/**/*.swift"
      - "scripts/release/check_unchecked_sendable_policy.sh"
      - ".github/workflows/unchecked-sendable-policy.yml"

jobs:
  unchecked-sendable-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run unchecked sendable guard
        run: bash scripts/release/check_unchecked_sendable_policy.sh
