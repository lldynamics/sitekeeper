name: Release Gate

on:
  pull_request:
    paths:
      - "project.yml"
      - "sitekeeper.xcodeproj/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".swiftlint-baseline.json"
      - "Config/**"
      - "Sources/**"
      - "Widget/**"
      - "Tests/**"
      - "UITests/**"
      - "scripts/release/**"
      - "scripts/dev/**"
      - "scripts/localization/**"
      - "scripts/legal/**"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - ".github/workflows/release-gate.yml"

  push:
    branches:
      - main
    paths:
      - "project.yml"
      - "sitekeeper.xcodeproj/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".swiftlint-baseline.json"
      - "Config/**"
      - "Sources/**"
      - "Widget/**"
      - "Tests/**"
      - "UITests/**"
      - "scripts/release/**"
      - "scripts/dev/**"
      - "scripts/localization/**"
      - "scripts/legal/**"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - ".github/workflows/release-gate.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-boundaries:
    name: Release boundary policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run release boundary policies
        run: |
          bash scripts/release/check_file_deletion_policy.sh
          bash scripts/release/check_datastore_write_policy.sh
          bash scripts/release/check_backup_contract_boundary.sh
          bash scripts/release/check_drawing_release_boundary.sh
          bash scripts/release/check_dynamic_type_policy.sh
          bash scripts/release/check_userdefaults_policy.sh
          bash scripts/release/check_swiftui_identity_policy.sh
          bash scripts/release/check_unchecked_sendable_policy.sh
          bash scripts/release/check_appstore_archive_config.sh
          python3 scripts/release/check_build_guard_contract.py
          bash scripts/tests/test_policy_search.sh
          python3 -m unittest discover -s scripts/release -p 'test_check_ui_test_results.py'
          bash scripts/localization/check_localization_hardcoded_ui.sh --strict
          python3 scripts/legal/export_privacy_policy.py --check

  iOS-release-gate:
    name: iOS build, unit tests and release preflight
    needs: release-boundaries
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_27.1.0.app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_27.1.0.app/Contents/Developer bash scripts/release/check_xcode_version.sh

      - name: Install release tools
        run: |
          bash scripts/release/install_ci_tools.sh "$RUNNER_TEMP/sitekeeper-tools"
          echo "$RUNNER_TEMP/sitekeeper-tools" >> "$GITHUB_PATH"

      - name: Check ZIP adapter and system unzip interoperability
        run: bash scripts/tests/test_zip_adapter.sh

      - name: Run one-click release gate
        env:
          DERIVED_DATA_PATH: /tmp/sitekeeper-release-derived-data
          SIMULATOR_NAME: sitekeeper-ci-release
        run: |
          export PATH="$RUNNER_TEMP/sitekeeper-tools:$PATH"
          xcodegen --version
          scripts/release/one_click_release_check.sh

  ui-smoke:
    name: UI smoke (${{ matrix.device_family }})
    needs: release-boundaries
    runs-on: xcode-27
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        device_family: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_27.1.0.app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_27.1.0.app/Contents/Developer bash scripts/release/check_xcode_version.sh

      - name: Install UI test tools
        run: |
          bash scripts/release/install_ci_tools.sh "$RUNNER_TEMP/sitekeeper-tools" --ui
          echo "$RUNNER_TEMP/sitekeeper-tools" >> "$GITHUB_PATH"

      - name: Run adaptive UI smoke tests
        env:
          DEVICE_FAMILY: ${{ matrix.device_family }}
          DERIVED_DATA_PATH: /tmp/sitekeeper-ui-smoke-derived-data
          RESULT_BUNDLE_PATH: /tmp/sitekeeper-ui-smoke-${{ matrix.device_family }}.xcresult
        run: |
          export PATH="$RUNNER_TEMP/sitekeeper-tools:$PATH"
          xcodegen --version
          scripts/release/run_ui_smoke.sh

      - name: Upload UI smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ matrix.device_family }}-xcresult
          path: /tmp/sitekeeper-ui-smoke-${{ matrix.device_family }}.xcresult
          if-no-files-found: warn
          retention-days: 14
